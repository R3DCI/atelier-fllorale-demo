<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouquet sur mesure – Atelier Floral</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="script.js" defer></script>
</head>

<body>

<header class="page-header">
    <h1>Bouquet sur mesure</h1>
    <p>Dites-nous ce que vous souhaitez, nous créons votre bouquet unique.</p>
</header>

<section class="section">

<form class="custom-form" id="customForm">

    <label>Budget souhaité</label>
    <select name="budget" required>
        <option value="20 000 CFA">20 000 CFA</option>
        <option value="30 000 CFA">30 000 CFA</option>
        <option value="40 000 CFA">40 000 CFA</option>
        <option value="50 000 CFA">50 000 CFA</option>
        <option value="75 000 CFA">75 000 CFA</option>
    </select>

    <label>Couleurs souhaitées</label>
    <input type="text" name="couleurs" placeholder="ex : pastel, blanc, rouge..." required>

    <label>Style</label>
    <select name="style">
        <option>Romantique</option>
        <option>Pastel</option>
        <option>Coloré</option>
        <option>Élégant</option>
        <option>Minimal</option>
    </select>

    <label>Occasion</label>
    <input type="text" name="occasion" placeholder="ex : anniversaire, amour, remerciement..." required>

    <label>Date souhaitée</label>
    <input type="date" name="date" required>

    <label>Heure souhaitée</label>
    <input type="time" name="heure" required>

    <label>Adresse de livraison (optionnel)</label>
    <input type="text" name="adresse" placeholder="ex : Cocody, Angré, Plateau...">

    <button type="submit" class="btn">Envoyer la demande</button>
</form>

</section>

<footer>
    <a href="index.html">Retour à l'accueil</a>
</footer>

</body>
</html>
